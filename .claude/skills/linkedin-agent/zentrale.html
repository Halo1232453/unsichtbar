<title>LinkedIn-Zentrale digitalONLY</title>

<style>
/* Layout: Redaktions-Raster. Kopf mit Logo, Reiter, darunter die Beiträge als Kacheln
   (Bild oben, Feed-Vorschau mit Handy-Schnittlinie, Aktionen unten). Details in einem Blatt. */
:root {
  --bg: #f2f1ed; --surface: #ffffff; --sunk: #e8e6e0; --ink: #121211; --muted: #5d5b55; --line: #d6d3cb;
  --acc: #d92d1a; --acc-soft: #fbe2dd; --on-acc: #ffffff;
  --pass: #23743a; --pass-soft: #e0efe2; --review: #8f5400; --review-soft: #f7ead2; --flag: #b42318; --flag-soft: #fbe3e0;
  --mark: #ffe07a; --mark-ink: #3d2c00; --logo: none; --shadow: 0 10px 28px rgba(18,18,17,.10);
  --display: "Jost", "Avenir Next", "Futura", "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --feed: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --surface: #1d1d1b; --sunk: #262623; --ink: #efede7; --muted: #a29f96; --line: #36352f;
    --acc: #ff5a46; --acc-soft: #3d1a15; --on-acc: #1b0703;
    --pass: #6fcf87; --pass-soft: #17331f; --review: #f0b65a; --review-soft: #3a2a10; --flag: #f2877c; --flag-soft: #3d1b17;
    --mark: #5a4710; --mark-ink: #ffe9a8; --logo: invert(1); --shadow: 0 10px 28px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --surface: #1d1d1b; --sunk: #262623; --ink: #efede7; --muted: #a29f96; --line: #36352f;
  --acc: #ff5a46; --acc-soft: #3d1a15; --on-acc: #1b0703;
  --pass: #6fcf87; --pass-soft: #17331f; --review: #f0b65a; --review-soft: #3a2a10; --flag: #f2877c; --flag-soft: #3d1b17;
  --mark: #5a4710; --mark-ink: #ffe9a8; --logo: invert(1); --shadow: 0 10px 28px rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--display);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 56px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.mono { font-family: var(--mono); }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; border-bottom: 4px solid var(--ink); padding-bottom: 16px; }
.brand { display: flex; align-items: flex-end; gap: 18px; min-width: 0; }
.brand img { height: 54px; width: auto; filter: var(--logo); display: block; }
.brand h1 { margin: 0; font-weight: 800; font-size: clamp(26px, 4vw, 38px); line-height: 1; letter-spacing: -.02em; }
.brand small { display: block; font: 700 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.autopilot { font: 400 13px var(--mono); color: var(--muted); display: grid; gap: 2px; text-align: right; }
.autopilot b { color: var(--ink); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); margin-right: 6px; vertical-align: 1px; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 4px; overflow-x: auto; padding-block: 6px; scrollbar-width: none; }
nav.tabs a { flex: none; text-decoration: none; color: var(--ink); font: 700 13px var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 10px 14px; border: 2px solid transparent; }
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
nav.tabs a:hover:not([aria-current]) { border-color: var(--ink); }
.count { margin-left: 8px; background: var(--acc); color: var(--on-acc); padding: 1px 7px; font-size: 11px; }

.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; border: 2px solid var(--ink); }
.seg button { border: 0; background: transparent; padding: 6px 11px; font: 700 12px var(--mono); letter-spacing: .04em; cursor: pointer; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.stats { display: flex; flex-wrap: wrap; gap: 8px; font: 400 13px var(--mono); color: var(--muted); }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 18px; align-items: start; }
.card { background: var(--surface); box-shadow: var(--shadow); display: grid; min-width: 0; }
.card.st-gepostet { opacity: .82; }
.media { position: relative; aspect-ratio: 4 / 5; background: var(--sunk); overflow: hidden; max-width: 100%; }
.media img, .media video { width: 100%; height: 100%; object-fit: contain; display: block; background: var(--sunk); }
.media .empty { position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; text-align: center; padding: 20px; color: var(--muted); font: 400 13px var(--mono); }
.media .empty b { font: 800 18px var(--display); color: var(--ink); }
.thumbs { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; }
.thumbs button { width: 30px; height: 30px; border: 2px solid var(--ink); background: var(--surface); font: 700 12px var(--mono); cursor: pointer; padding: 0; }
.thumbs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.kind { position: absolute; right: 10px; top: 10px; background: var(--ink); color: var(--bg); font: 700 11px var(--mono); letter-spacing: .1em; padding: 4px 8px; }

.body { padding: 16px 18px 18px; display: grid; gap: 10px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.when { font: 700 12px var(--mono); letter-spacing: .06em; margin-right: auto; font-variant-numeric: tabular-nums; }
.chip { font: 700 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; border: 1.5px solid var(--ink); }
.chip.k-kyrill { background: var(--ink); color: var(--bg); }
.chip.s-entwurf { border-color: var(--review); color: var(--review); }
.chip.s-geplant { border-color: var(--acc); color: var(--acc); }
.chip.s-gepostet { border-color: var(--pass); color: var(--pass); }
.chip.s-verworfen { border-color: var(--muted); color: var(--muted); }
.card h3 { margin: 0; font-weight: 800; font-size: 20px; line-height: 1.15; text-wrap: balance; }
.hook { font: 400 12px var(--mono); color: var(--muted); }
.feed { font: 15px/1.45 var(--feed); white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.cut { display: block; margin: 6px 0 0; border-top: 2px dashed var(--acc); padding-top: 4px; font: 700 11px var(--mono); color: var(--acc); letter-spacing: .05em; }
mark { background: var(--mark); color: var(--mark-ink); padding: 0 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; font: 400 12px var(--mono); color: var(--muted); align-items: center; }
.pill { padding: 2px 7px; font: 700 11px var(--mono); }
.pill.PASS { background: var(--pass-soft); color: var(--pass); }
.pill.REVIEW { background: var(--review-soft); color: var(--review); }
.pill.FLAGGED, .pill.warn { background: var(--flag-soft); color: var(--flag); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spacer { flex: 1; }
.btn { border: 2px solid var(--ink); background: var(--surface); padding: 8px 13px; font: 700 13px var(--mono); cursor: pointer; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.primary:hover { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.btn.small { padding: 5px 9px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; text-decoration: underline; }
.btn.danger { border-color: var(--flag); color: var(--flag); }
.btn:disabled { opacity: .5; cursor: default; }

#app { display: grid; gap: 18px; min-width: 0; }
.media.none { aspect-ratio: 16 / 7; }
.notice { background: var(--surface); border-left: 6px solid var(--acc); padding: 16px 18px; box-shadow: var(--shadow); }
.week { display: grid; gap: 14px; }
.week-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.week-head h2 { margin: 0; font-weight: 800; font-size: 26px; }
.week-head span { font: 400 13px var(--mono); color: var(--muted); }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 520px; }
.strip div { text-align: center; font: 700 12px var(--mono); padding: 6px 0; border: 1.5px solid var(--line); color: var(--muted); }
.strip div.has { border-color: var(--ink); color: var(--ink); background: var(--surface); }
.strip div.today { outline: 3px solid var(--acc); outline-offset: -3px; }

/* Detail-Blatt */
.sheet-bg { position: fixed; inset: 0; background: rgba(10,10,9,.55); z-index: 30; display: flex; justify-content: flex-end; }
.sheet { background: var(--bg); width: min(980px, 100%); height: 100%; overflow-y: auto; padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) 18px; display: grid; gap: 18px; align-content: start; }
.sheet-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; border-bottom: 3px solid var(--ink); padding-bottom: 12px; }
.sheet-head h2 { margin: 0; font-weight: 800; font-size: 26px; line-height: 1.1; text-wrap: balance; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.gallery { display: grid; gap: 14px; }
.mitem { background: var(--surface); box-shadow: var(--shadow); display: grid; }
.mitem .media { aspect-ratio: auto; max-height: 70vh; }
.mitem .media img, .mitem .media video { height: auto; max-height: 70vh; }
.mitem .actions { padding: 10px 12px; }
.mname { font: 400 12px var(--mono); color: var(--muted); margin-right: auto; overflow-wrap: anywhere; }
.panel { background: var(--surface); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.label { font: 700 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
textarea { width: 100%; min-height: 380px; border: 2px solid var(--ink); background: var(--surface); padding: 12px; font: 15px/1.45 var(--feed); resize: vertical; }
textarea.short { min-height: 110px; }
textarea.tall { min-height: 60vh; font: 13px/1.5 var(--mono); }
.upload { border: 2px dashed var(--line); padding: 16px; display: grid; gap: 8px; text-align: center; }
.upload input { max-width: 100%; }

.list { display: grid; gap: 10px; }
.li { background: var(--surface); box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.guide { background: var(--surface); box-shadow: var(--shadow); padding: 22px; display: grid; gap: 14px; max-width: 860px; }
.guide h2 { margin: 0; font-weight: 800; font-size: 24px; }
.guide ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.guide p { margin: 0; max-width: 68ch; }
.cmds { overflow-x: auto; }
.cmds table { border-collapse: collapse; width: 100%; }
.cmds td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.cmds td:first-child { font: 700 13px var(--mono); color: var(--acc); white-space: nowrap; }
.voice { font: 13px/1.55 var(--mono); }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; font: 700 13px var(--mono); z-index: 40; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .18s ease-out; }
  .sheet { animation: slide .2s ease-out; }
  @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } }
  @keyframes slide { from { transform: translateX(30px); opacity: .4; } }
}
@media (max-width: 560px) { .autopilot { text-align: left; } .brand img { height: 44px; } }
</style>

  function card(p) {
    var text = String(p.text || ""), cutAt = 140;

  /* ---------- Ansichten ---------- */

  function rasterView() {

    } else h += '<div class="grid">' + list.map(card).join("") + '</div>';

  function weekView() {
    if (dbState === "loading") return '<div class="notice">Beiträge werden geladen ...</div>';
    var mon = mondayOf(today());
    var up = S.posts.filter(function (p) { var d = parseDate(p.datum); return d && d >= mon && p.status !== "verworfen"; }).sort(sortPosts);
    if (!up.length) return '<div class="notice"><b>Für diese und die nächsten Wochen ist noch nichts geplant.</b><br>Im Chat <span class="mono">/li-woche</span> starten, dann liegen drei Entwürfe hier.</div>';
    var g = {}; up.forEach(function (p) { var k = key(mondayOf(parseDate(p.datum))); (g[k] = g[k] || []).push(p); });
    var t = today();
    return Object.keys(g).sort().map(function (k) {
      var m = parseDate(k), sun = new Date(m); sun.setDate(m.getDate() + 6); var list = g[k];
      var h = '<section class="week"><div class="week-head"><h2>KW ' + isoWeek(m) + (key(m) === key(mondayOf(t)) ? " · diese Woche" : "") + '</h2><span>' + m.getDate() + "." + (m.getMonth() !== sun.getMonth() ? " " + MONTHS[m.getMonth()] : "") + "–" + sun.getDate() + ". " + MONTHS[sun.getMonth()] + '</span></div><div class="strip">';
      for (var i = 0; i < 7; i++) { var d = new Date(m); d.setDate(m.getDate() + i);

      h += '<div class="actions"><button class="btn primary" data-act="save" data-id="' + esc(p.id) + '">Speichern</button><button class="btn" data-act="cancel-edit">Abbrechen</button></div>';

    if (p.notiz) h += '<div class="panel"><span class="label">Notiz vom Agenten</span><div>' + esc(p.notiz) + '</div></div>';
    if (canWrite && db) {
      h += '<div class="panel"><span class="label">Status</span><div class="actions">' + statusSeg(p) + '<span class="spacer"></span>';

  function render() {

      (S.meta && S.meta.letzter_lauf ? '<span>Letzter Wochenlauf ' + esc(fmtStamp(S.meta.letzter_lauf)) + (S.meta.zielwoche ? " · " + esc(S.meta.zielwoche) : "") + '</span>' : '');

  /* ---------- Aktionen ---------- */

  function writeFailed(e) {
    if (e && (e.code === "permission_denied" || e.code === "invalid_argument" || e.code === "not_granted")) { canWrite = false; render(); toast("Nur Lesezugriff auf dieser Seite."); return; }
    toast("Speichern hat nicht geklappt. Nochmals versuchen.");
  }
  function upd(id, data, msg) {
    data.aktualisiert = new Date().toISOString();
    return db.doc("posts/" + id).update(data).then(function () { if (msg) toast(msg); }, writeFailed);
  }

  function onClick(ev) {
    var b = ev.target.closest("[data-act]"); if (!b) return;
    var act = b.dataset.act, id = b.dataset.id, p = id ? find(id) : null, i = +b.dataset.i || 0;
    if (act === "close-bg") { if (ev.target === b) { S.sheet = null; S.editing = null; S.confirm = null; render(); } return; }
    if (act === "close") { S.sheet = null; S.editing = null; S.confirm = null; render(); return; }
    if (act === "copy" && p) { copy(String(p.text || "")); if (placeholders(p.text).length) setTimeout(function () { toast("Achtung: noch Platzhalter im Text."); }, 2700); return; }
    if (act === "copy-c" && p) { copy(String(p.erster_kommentar || ""), "Kommentar kopiert."); return; }
    if (act === "open" && p) { S.sheet = id; S.confirm = null; render(); var c = document.querySelector('.sheet [data-act="close"]'); if (c) c.focus(); return; }
    if (act === "media") { S.media[id] = i; render(); return; }
    if (act === "fk") { S.fK = b.dataset.v; render(); return; }
    if (act === "fs") { S.fS = b.dataset.v; render(); return; }
    if (act === "toggle") { S.open[id] = !S.open[id]; render(); return; }
    if (act === "no") { S.confirm = null; render(); return; }
    if (act === "edit" && p) { S.editing = { id: id, draft: String(p.text || "") }; render(); var ta = document.getElementById("edit-" + id); if (ta) ta.focus(); return; }
    if (act === "cancel-edit") { S.editing = null; render(); return; }
    if (act === "drop" || act === "m-del" || act === "idea-del") { S.confirm = (act === "drop" ? "drop:" + id : act === "m-del" ? "m:" + id + ":" + i : "idea:" + id); render(); return; }
    if (act === "stimme-edit") { S.stimmeDraft = S.stimme && S.stimme.text ? S.stimme.text : ""; render(); return; }
    if (act === "stimme-cancel") { S.stimmeDraft = null; render(); return; }
    if (act === "dl" && p) { saveMedia(p, i, b); return; }
    if (!db) return;
    if (act === "save" && p) { b.disabled = true; upd(id, { text: S.editing ? S.editing.draft : p.text, bearbeitet: true }, "Gespeichert.").then(function () { S.editing = null; render(); }); return; }
    if (act === "status" && p) { var st = b.dataset.st; if ((p.status || "entwurf") === st) return; upd(id, { status: st }, st === "gepostet" ? "Als gepostet markiert." : st === "geplant" ? "Als geplant markiert." : "Status: Entwurf."); return; }
    if (act === "drop-yes" && p) { S.confirm = null; upd(id, { status: "verworfen" }, "Verworfen. Liegt im Archiv."); return; }
    if (act === "m-del-yes" && p) { S.confirm = null; var ms = medien(p).slice(); ms.splice(i, 1); upd(id, { medien: ms }, "Vom Beitrag entfernt."); return; }
    if (act === "stimme-save") { var txt = S.stimmeDraft || ""; if (!txt.trim()) { toast("Die Stimme darf nicht leer sein."); return; } b.disabled = true;
      db.doc("config/stimme").set({ text: txt, aktualisiert: new Date().toISOString() }).then(function () { S.stimmeDraft = null; pendingRender = false; render(); toast("Stimme gespeichert."); }, function (e) { b.disabled = false; writeFailed(e); }); return; }
    if (act === "idea-del-yes") { S.confirm = null; db.doc("ideen/" + id).delete().then(function () { toast("Idee entfernt."); }, writeFailed); return; }
  }

  function saveMedia(p, i, b) {
    var m = medien(p)[i]; if (!m || !downloads) return;
    b.disabled = true;
    fetch(src(m)).then(function (r) { if (!r.ok) throw new Error("fetch"); return r.blob(); })
      .then(function (blob) {
        var ext = m.typ === "video" ? "mp4" : (/jpe?g/.test(blob.type) ? "jpg" : /webp/.test(blob.type) ? "webp" : "png");
        var name = String(m.name || (p.id + (m.typ === "video" ? "-video" : "-bild"))).replace(/\.[a-z0-9]+$/i, "") + "." + ext;
        return downloads.save({ filename: name, data: blob });
      })
      .then(function () { toast("Gespeichert. In LinkedIn hochladen."); }, function (e) {
        var c = e && e.code;
        toast(c === "declined" ? "Nicht gespeichert." : c === "rate_limited" ? "Gerade läuft schon ein Speichern. Kurz warten." : "Speichern geht hier nicht. «Öffnen» und dort sichern.");
        if (c === "unavailable" || c === "not_granted") { downloads = null; render(); }
      })
      .then(function () { b.disabled = false; });
  }

  function onChange(ev) {
    var t = ev.target; if (!t.dataset || !t.dataset.up) return;
    var id = t.dataset.up, p = find(id), f = t.files && t.files[0]; if (!p || !f || !assets) return;
    if (f.size > 20 * 1024 * 1024) { toast("Die Datei ist grösser als 20 MB."); t.value = ""; return; }
    S.busy = true; toast("Wird hochgeladen ...");
    assets.upload(f).then(function (r) {
      var ms = medien(p).slice(); ms.push({ id: r.id, typ: /^video\//.test(r.contentType) ? "video" : "bild", name: f.name });
      return upd(id, { medien: ms }, "Hinzugefügt.");
    }, function (e) { toast(e && e.code === "too_large" ? "Die Datei ist zu gross." : "Hochladen hat nicht geklappt."); })
      .then(function () { S.busy = false; render(); });
  }

  document.addEventListener("click", onClick);
  document.addEventListener("change", onChange);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.sheet) { S.sheet = null; S.editing = null; S.confirm = null; render(); } });
  document.addEventListener("input", function (ev) {
    var t = ev.target;
    if (t.dataset && t.dataset.edit && S.editing) S.editing.draft = t.value;
    if (t.id === "idee-text") S.ideaDraft = t.value;
    if (t.id === "stimme-text") S.stimmeDraft = t.value;
  });
  document.addEventListener("submit", function (ev) {
    if (ev.target.id !== "idea-form") return; ev.preventDefault();
    var text = S.ideaDraft.trim(); if (!text) { toast("Erst kurz beschreiben, was passiert ist."); return; } if (!db) return;
    var id = new Date().toISOString().slice(0, 10) + "-" + Math.random().toString(36).slice(2, 8);
    db.collection("ideen").doc(id).set({ text: text, status: "neu", erstellt: new Date().toISOString() })
      .then(function () { S.ideaDraft = ""; if (document.activeElement) document.activeElement.blur(); pendingRender = false; render(); toast("Idee abgelegt."); }, writeFailed);
  });

  function setTab() {
    var h = (location.hash || "").replace("#", "");
    S.tab = ["raster", "woche", "ideen", "stimme", "archiv", "anleitung"].indexOf(h) >= 0 ? h : "raster";
    S.confirm = null; render();
  }
  window.addEventListener("hashchange", setTab);
  setTab();

  /* ---------- Daten ---------- */

  function start() {
    if (!window.claude || typeof window.claude.use !== "function") { dbState = "none"; render(); return; }
    var timer = setTimeout(function () { if (dbState === "loading") { dbState = "error"; render(); } }, 10000);
    window.claude.use("user").then(function (u) {
      if (u && typeof u.can === "function") Promise.resolve(u.can("data.write")).then(function (ok) { if (ok === false) { canWrite = false; render(); } }, function () {});
    }, function () {});
    window.claude.use("assets").then(function (a) { assets = a; if (S.sheet) render(); }, function () {});
    window.claude.use("downloads").then(function (d) { downloads = d; if (S.sheet) render(); }, function () {});
    window.claude.use("db").then(function (d) {
      if (!d) { clearTimeout(timer); dbState = "none"; render(); return; }
      db = d;
      var fail = function () { clearTimeout(timer); dbState = "error"; render(); };
      db.collection("posts").onSnapshot(function (snap) {
        clearTimeout(timer); dbState = "ok";
        S.posts = snap.docs.map(function (x) { var o = Object.assign({}, x.data()); o.id = x.id; return o; });
        scheduleRender();
      }, fail);
      db.collection("ideen").onSnapshot(function (snap) { S.ideen = snap.docs.map(function (x) { var o = Object.assign({}, x.data()); o.id = x.id; return o; }); scheduleRender(); }, function () {});
      db.doc("config/stimme").onSnapshot(function (s) { S.stimme = s.exists ? s.data() : null; scheduleRender(); }, function () {});
      db.doc("meta/autopilot").onSnapshot(function (s) { S.meta = s.exists ? s.data() : null; scheduleRender(); }, function () {});
    }, function () { clearTimeout(timer); dbState = "error"; render(); });
  }
  start();
})();
</script>
